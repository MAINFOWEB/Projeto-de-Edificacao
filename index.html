<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>AutoPlanta Designer - MAINFOWEB</title>
    <style>
        :root { --blue: #00d2ff; --dark: #121212; --panel: #1e1e1e; --green: #28a745; --orange: #ff9800; --red: #dc3545; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; background: var(--dark); color: white; height: 100vh; overflow: hidden; }
        #sidebar { width: 340px; background: var(--panel); padding: 15px; border-right: 1px solid #333; overflow-y: auto; flex-shrink: 0; }
        #canvas-container { flex: 1; background: #333; display: flex; align-items: flex-start; justify-content: center; overflow: auto; padding: 30px; }
        #inventory { width: 220px; background: #181818; padding: 15px; border-left: 1px solid #333; flex-shrink: 0; }
        .section { background: #252525; padding: 12px; border-radius: 5px; margin-bottom: 10px; border-left: 3px solid var(--blue); }
        .item-pronto { background: #333; padding: 8px; margin-bottom: 8px; border-radius: 4px; cursor: pointer; border: 1px solid #444; font-size: 11px; }
        input, select, button { width: 100%; padding: 10px; margin: 5px 0; border-radius: 4px; border: none; background: #333; color: white; box-sizing: border-box; }
        .btn-add { background: var(--green); color: white; cursor: pointer; font-weight: bold; }
        .btn-export { background: var(--orange); color: #000; cursor: pointer; font-weight: bold; }
        canvas { background: #fff; box-shadow: 0 0 20px rgba(0,0,0,0.5); cursor: crosshair; }
    </style>
</head>
<body>

<div id="sidebar">
    <h2 style="margin:0 0 15px 0">AutoPlanta <span style="color:var(--blue)">Color</span></h2>
    
    <div class="section">
        <label><b>1. ESCOLHA A COR DO ITEM</b></label>
        <input type="color" id="cor_escolhida" value="#f4e4bc">
    </div>

    <div class="section">
        <label><b>2. SELECIONE O COMPONENTE</b></label>
        <select id="sel_tipo">
            <optgroup label="Cômodos (Preenchimento)">
                <option value="quarto">Quarto</option>
                <option value="sala">Sala / Living</option>
                <option value="cozinha">Cozinha</option>
                <option value="banheiro">Banheiro</option>
                <option value="suite_master">Suíte Master (C/ Closet)</option>
            </optgroup>
            <optgroup label="Móveis (image_1c455d.jpg)">
                <option value="cama">Cama Casal</option>
                <option value="sofa">Sofá de Canto</option>
                <option value="mesa">Mesa de Trabalho</option>
                <option value="banheira">Banheira / Ofurô</option>
            </optgroup>
            <optgroup label="Esquadrias (Sempre à Frente)">
                <option value="porta">Porta de Giro</option>
                <option value="janela">Janela de Correr</option>
            </optgroup>
        </select>
        <button class="btn-add" onclick="adicionarAoEstoque()">COLOCAR NO ESTOQUE</button>
    </div>

    <div class="section">
        <label><b>GERENCIAMENTO</b></label>
        <button onclick="limparTudo()" style="background:var(--red)">LIMPAR PROJETO</button>
        <button class="btn-export" onclick="alert('Relatório gerado!')" style="margin-top:10px">GERAR PDF</button>
    </div>
</div>

<div id="canvas-container">
    <canvas id="mainCanvas"></canvas>
</div>

<div id="inventory">
    <h3>📦 Itens Prontos</h3>
    <div id="lista-estoque"></div>
</div>

<script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const escala = 25; 
    canvas.width = 800; canvas.height = 600;
    
    let itens = [];
    let estoque = [];
    let selecionado = null, arrastando = false, offset = { x: 0, y: 0 };

    function adicionarAoEstoque() {
        const tipo = document.getElementById('sel_tipo').value;
        const cor = document.getElementById('cor_escolhida').value;
        let w = 4, h = 4;

        // Dimensões base
        if(tipo === 'banheiro') { w = 2; h = 3; }
        if(tipo === 'cama') { w = 1.8; h = 2; }
        if(tipo === 'sofa') { w = 2.5; h = 1.5; }
        if(tipo === 'porta' || tipo === 'janela') { w = 1; h = 0.2; }

        estoque.push({ id: Date.now(), tipo, w, h, cor });
        atualizarUI();
    }

    function atualizarUI() {
        const list = document.getElementById('lista-estoque');
        list.innerHTML = '';
        estoque.forEach(i => {
            const d = document.createElement('div');
            d.className = 'item-pronto';
            d.style.borderLeft = `4px solid ${i.cor}`;
            d.innerHTML = `${i.tipo.toUpperCase()}`;
            d.onclick = () => { itens.push({...i, x: 50, y: 50, rot: 0}); desenhar(); };
            list.appendChild(d);
        });
    }

    function desenharGrid() {
        ctx.strokeStyle = "#e0e0e0"; ctx.lineWidth = 0.5;
        for(let x=0; x<canvas.width; x+=escala) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke(); }
        for(let y=0; y<canvas.height; y+=escala) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke(); }
    }

    function desenharItem(o) {
        const w = o.w * escala; const h = o.h * escala;
        ctx.save();
        ctx.translate(o.x + w/2, o.y + h/2);
        ctx.rotate(o.rot * Math.PI / 180);

        // Se for cômodo (fundo)
        if(['quarto','sala','cozinha','banheiro','suite_master'].includes(o.tipo)) {
            ctx.fillStyle = o.cor;
            ctx.fillRect(-w/2, -h/2, w, h);
            ctx.strokeStyle = "#444"; ctx.lineWidth = 3;
            ctx.strokeRect(-w/2, -h/2, w, h);
            
            if(o.tipo === 'suite_master') {
                ctx.setLineDash([5,5]);
                ctx.strokeRect(-w/2 + 5, -h/2 + 5, w/2, h/3); // Representação de closet
                ctx.setLineDash([]);
            }
        } 
        // Se for Móvel
        else if(['cama','sofa','mesa','banheira'].includes(o.tipo)) {
            ctx.fillStyle = "#fff";
            ctx.strokeStyle = "#888"; ctx.lineWidth = 1;
            ctx.fillRect(-w/2 + 2, -h/2 + 2, w-4, h-4);
            ctx.strokeRect(-w/2 + 2, -h/2 + 2, w-4, h-4);
            ctx.fillStyle = "#444"; ctx.font = "8px Arial";
            ctx.fillText(o.tipo, -w/2 + 5, 0);
        }
        // Se for Esquadria (Porta/Janela)
        else {
            ctx.fillStyle = o.tipo === 'porta' ? "#8b4513" : "#add8e6";
            ctx.fillRect(-w/2, -h/2, w, h);
            if(o.tipo === 'porta') {
                ctx.beginPath(); ctx.arc(-w/2, h/2, w, 0, -Math.PI/2, true); ctx.stroke();
            }
        }

        if(o === selecionado) { ctx.strokeStyle = var(--blue); ctx.lineWidth = 2; ctx.strokeRect(-w/2-2, -h/2-2, w+4, h+4); }
        ctx.restore();
    }

    function desenhar() {
        ctx.clearRect(0,0,canvas.width, canvas.height);
        desenharGrid();
        
        // ORDEM DE CAMADAS: 1. Cômodos, 2. Móveis, 3. Portas/Janelas
        const ordem = (t) => {
            if(['quarto','sala','cozinha','banheiro','suite_master'].includes(t)) return 1;
            if(['cama','sofa','mesa','banheira'].includes(t)) return 2;
            return 3;
        };

        itens.sort((a,b) => ordem(a.tipo) - ordem(b.tipo)).forEach(desenharItem);
    }

    function limparTudo() { if(confirm("Limpar tudo?")) { itens = []; desenhar(); } }

    canvas.onmousedown = (e) => {
        const r = canvas.getBoundingClientRect();
        const mx = e.clientX - r.left; const my = e.clientY - r.top;
        selecionado = null;
        for(let i=itens.length-1; i>=0; i--) {
            let o = itens[i];
            if(mx >= o.x && mx <= o.x + o.w*escala && my >= o.y && my <= o.y + o.h*escala) {
                selecionado = o; arrastando = true;
                offset.x = mx - o.x; offset.y = my - o.y; break;
            }
        }
        desenhar();
    };

    window.onmousemove = (e) => {
        if(arrastando && selecionado) {
            const r = canvas.getBoundingClientRect();
            selecionado.x = (e.clientX - r.left) - offset.x;
            selecionado.y = (e.clientY - r.top) - offset.y;
            desenhar();
        }
    };

    window.onmouseup = () => arrastando = false;
    window.onkeydown = (e) => {
        if(!selecionado) return;
        if(e.key.toLowerCase() === 'r') selecionado.rot = (selecionado.rot + 45) % 360;
        if(e.key === 'Delete') { itens = itens.filter(i => i !== selecionado); selecionado = null; }
        desenhar();
    };

    desenhar();
</script>
</body>
</html>
