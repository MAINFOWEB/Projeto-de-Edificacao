<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>AutoPlanta Pro v4 - Componentes Avançados</title>
    <style>
        :root { --blue: #00d2ff; --dark: #121212; --panel: #1e1e1e; --green: #28a745; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; background: var(--dark); color: white; height: 100vh; overflow: hidden; }
        
        #sidebar { width: 340px; background: var(--panel); padding: 15px; border-right: 1px solid #333; overflow-y: auto; }
        #inventory { width: 260px; background: #181818; padding: 15px; border-left: 1px solid #333; }
        
        .section { background: #252525; padding: 12px; border-radius: 5px; margin-bottom: 10px; border-left: 3px solid var(--blue); }
        .item-pronto { background: #333; padding: 10px; margin-bottom: 8px; border-radius: 4px; cursor: pointer; border: 1px solid #444; font-size: 11px; transition: 0.2s; position: relative; }
        .item-pronto:hover { border-color: var(--blue); background: #3d3d3d; }

        label { font-size: 12px; color: #aaa; }
        input, select, button { width: 100%; padding: 8px; margin: 5px 0; border-radius: 4px; border: none; background: #333; color: white; box-sizing: border-box; }
        .btn-add { background: var(--green); color: white; cursor: pointer; font-weight: bold; margin-top: 10px; }
        
        #canvas-container { flex: 1; background: #2a2a2a; display: flex; align-items: center; justify-content: center; position: relative; }
        canvas { background: white; box-shadow: 0 0 50px rgba(0,0,0,0.5); cursor: crosshair; }
        
        .badge { background: #444; padding: 2px 5px; border-radius: 3px; font-size: 9px; margin-right: 5px; }
    </style>
</head>
<body>

<div id="sidebar">
    <h2>AutoPlanta <span style="color:var(--blue)">v4</span></h2>
    
    <div class="section">
        <label>1. Categoria</label>
        <select id="cat_novo" onchange="ajustarSubtipos()">
            <option value="estrutura">Estrutura (Paredes)</option>
            <option value="abertura">Aberturas (Janela/Porta)</option>
        </select>

        <label>2. Tipo de Objeto</label>
        <select id="tipo_novo"></select>

        <label>3. Modelo / Divisões</label>
        <select id="modelo_novo">
            <option value="1">Simples (Única)</option>
            <option value="2">Dupla (2 Folhas)</option>
            <option value="3">Tripla (3 Folhas)</option>
        </select>

        <label>4. Dimensões (Metros)</label>
        <div style="display:flex; gap:5px">
            <input type="number" id="w_novo" placeholder="Larg" value="3.0" step="0.1">
            <input type="number" id="h_novo" placeholder="Alt" value="4.0" step="0.1">
        </div>
        <button class="btn-add" onclick="criarParaInventario()">+ ADICIONAR AO ESTOQUE</button>
    </div>

    <div class="section">
        <label>Configurações do Terreno</label>
        <div style="display:flex; gap:5px">
            <input type="number" id="terr_l" value="10" oninput="renderizar()">
            <input type="number" id="terr_c" value="20" oninput="renderizar()">
        </div>
    </div>
</div>

<div id="canvas-container">
    <canvas id="mainCanvas"></canvas>
</div>

<div id="inventory">
    <h3>📦 Itens Prontos</h3>
    <div id="lista-inventario"></div>
</div>

<script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    let escala = 30; 
    let projetoAtivo = [];
    let inventario = [];
    let selecionado = null;
    let offset = { x: 0, y: 0 };

    // Configuração inicial de menus
    function ajustarSubtipos() {
        const cat = document.getElementById('cat_novo').value;
        const tipoSelect = document.getElementById('tipo_novo');
        const modeloSelect = document.getElementById('modelo_novo');
        tipoSelect.innerHTML = '';
        
        if(cat === 'estrutura') {
            const itens = ['Quarto', 'Sala', 'Cozinha', 'Banheiro', 'Garagem', 'Piscina'];
            itens.forEach(i => tipoSelect.innerHTML += `<option value="${i.toLowerCase()}">${i}</option>`);
            modeloSelect.disabled = true;
        } else {
            const itens = ['Janela', 'Porta', 'Portão'];
            itens.forEach(i => tipoSelect.innerHTML += `<option value="${i.toLowerCase()}">${i}</option>`);
            modeloSelect.disabled = false;
        }
    }

    function criarParaInventario() {
        const cat = document.getElementById('cat_novo').value;
        const tipo = document.getElementById('tipo_novo').value;
        const modelo = parseInt(document.getElementById('modelo_novo').value);
        const w = parseFloat(document.getElementById('w_novo').value);
        const h = parseFloat(document.getElementById('h_novo').value);
        
        inventario.push({ id: Date.now(), cat, tipo, modelo, w, h });
        atualizarPainelInventario();
    }

    function atualizarPainelInventario() {
        const lista = document.getElementById('lista-inventario');
        lista.innerHTML = '';
        inventario.forEach(item => {
            const div = document.createElement('div');
            div.className = 'item-pronto';
            const modLabel = item.cat === 'abertura' ? `(${item.modelo}F)` : '';
            div.innerHTML = `<span class="badge">${item.tipo.toUpperCase()}</span> ${item.w}x${item.h}m ${modLabel}`;
            div.onclick = () => { 
                projetoAtivo.push({ ...item, x: 150, y: 150, rot: 0, id: Date.now() }); 
                renderizar(); 
            };
            lista.appendChild(div);
        });
    }

    function renderizar() {
        canvas.width = 700; canvas.height = 850;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const tl = document.getElementById('terr_l').value * escala;
        const tc = document.getElementById('terr_c').value * escala;

        // TERRENO
        ctx.strokeStyle = "#444"; ctx.setLineDash([5, 5]);
        ctx.strokeRect(50, 50, tl, tc);
        ctx.setLineDash([]);

        projetoAtivo.forEach(obj => {
            const w = obj.w * escala; const h = obj.h * escala;
            ctx.save();
            ctx.translate(obj.x + w/2, obj.y + h/2);
            ctx.rotate(obj.rot * Math.PI / 180);
            
            if(obj.cat === 'estrutura') {
                ctx.fillStyle = obj.tipo === 'piscina' ? '#b3e5fc' : '#ffffff';
                ctx.fillRect(-w/2, -h/2, w, h);
                ctx.strokeStyle = "#000"; ctx.lineWidth = 4;
                ctx.strokeRect(-w/2, -h/2, w, h);
            } else {
                // DESENHO DE JANELAS/PORTAS BASEADO NO MODELO (FOLHAS)
                ctx.fillStyle = "#fff";
                ctx.fillRect(-w/2, -h/2, w, h);
                ctx.strokeStyle = obj.tipo === 'janela' ? "#00d2ff" : "#8b4513";
                ctx.lineWidth = 2;
                ctx.strokeRect(-w/2, -h/2, w, h);

                // Linhas de Divisão (Tetris/Figma style)
                const step = w / obj.modelo;
                for(let i=1; i < obj.modelo; i++) {
                    ctx.beginPath();
                    ctx.moveTo(-w/2 + (step * i), -h/2);
                    ctx.lineTo(-w/2 + (step * i), h/2);
                    ctx.stroke();
                }
                
                // Detalhe Portão Garagem
                if(obj.tipo === 'portão') {
                    ctx.setLineDash([2, 2]);
                    ctx.strokeRect(-w/2 + 2, -h/2 + 2, w - 4, h - 4);
                    ctx.setLineDash([]);
                }
            }

            ctx.fillStyle = "#000"; ctx.font = "bold 9px Arial";
            ctx.fillText(obj.tipo.toUpperCase(), -w/2 + 3, -h/2 + 12);

            // Botão Girar
            ctx.fillStyle = "var(--blue)";
            ctx.beginPath(); ctx.arc(0, -h/2 - 15, 6, 0, Math.PI*2); ctx.fill();
            
            ctx.restore();
        });
    }

    canvas.onmousedown = (e) => {
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left; const my = e.clientY - rect.top;

        for (let i = projetoAtivo.length - 1; i >= 0; i--) {
            let o = projetoAtivo[i];
            const w = o.w * escala; const h = o.h * escala;
            const rotX = o.x + w/2; const rotY = o.y - 15;
            const dist = Math.sqrt((mx - rotX)**2 + (my - rotY)**2);
            
            if(dist < 15) { o.rot = (o.rot + 90) % 360; renderizar(); return; }
            if (mx >= o.x && mx <= o.x + w && my >= o.y && my <= o.y + h) {
                selecionado = o;
                offset.x = mx - o.x; offset.y = my - o.y;
                break;
            }
        }
    };

    window.onmousemove = (e) => {
        if (selecionado) {
            const rect = canvas.getBoundingClientRect();
            selecionado.x = e.clientX - rect.left - offset.x;
            selecionado.y = e.clientY - rect.top - offset.y;
            renderizar();
        }
    };

    window.onmouseup = () => { selecionado = null; };
    ajustarSubtipos();
    renderizar();
</script>
</body>
</html>
