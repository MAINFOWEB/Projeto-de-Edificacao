<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Projeto de Edificação</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="sidebar">
    <h3 class="titulo-topo">Projeto de <span class="azul">Edificação</span></h3>
    
    <div class="section">
        <label>🎨 COR DO CÔMODO</label>
        <div class="color-picker-container">
            <input type="color" id="cor_escolhida" value="#e0f7fa" onchange="atualizaPreviewCor()">
            <div id="preview-cor"></div>
        </div>
    </div>

    <div class="section">
        <label>🏢 PAVIMENTO (CRIAR)</label>
        <select id="sel_andar">
            <option value="1">1º Andar (Térreo)</option>
            <option value="2">2º Andar (Superior)</option>
        </select>
    </div>

    <div class="section">
        <label>👁️ EXIBIR NO PAPEL</label>
        <select id="sel_andar_view" onchange="desenhar()">
            <option value="1">Ver 1º Andar</option>
            <option value="2">Ver 2º Andar</option>
        </select>
    </div>

    <div class="section">
        <label>📐 COMPONENTE</label>
        <select id="sel_tipo">
            <optgroup label="Suítes e Kitnet (Com Banheiro)">
                <option value="suite_master">Suíte Master + Closet</option>
                <option value="suite_comum">Suíte Comum</option>
                <option value="kitnet">Kitnet</option>
            </optgroup>
            <optgroup label="Cômodos Padrão">
                <option value="quarto">Quarto</option>
                <option value="sala">Sala de Estar</option>
                <option value="cozinha">Cozinha</option>
                <option value="banheiro">Banheiro Social</option>
                <option value="lavanderia">Lavanderia</option>
                <option value="corredor">Corredor</option>
                <option value="garagem">Garagem</option>
                <option value="piscina">Piscina</option>
            </optgroup>
            <optgroup label="Mobiliário">
                <option value="mesa_4">Mesa (4 Lug)</option>
                <option value="mesa_8">Mesa (8 Lug)</option>
                <option value="sofa_2">Sofá (2 Lug)</option>
            </optgroup>
            <optgroup label="Acessos">
                <option value="porta_dupla">Porta Dupla</option>
                <option value="janela_dupla">Janela Dupla</option>
                <option value="janela_basculante">Janela Basculante</option>
            </optgroup>
        </select>
        <button class="btn-add" onclick="adicionarAoEstoque()">MANDAR PARA ESTOQUE</button>
    </div>

    <div class="section">
        <label>📄 DADOS TÉCNICOS</label>
        <input type="text" id="cli_nome" placeholder="Nome do Cliente" oninput="desenhar()">
        <input type="text" id="resp_tec" placeholder="Responsável Técnico" oninput="desenhar()">
        <input type="number" id="area_terreno" placeholder="Área do Terreno (m²)" oninput="desenhar()">
    </div>

    <button class="btn-print" onclick="window.print()">🖨️ GERAR PDF / IMPRIMIR</button>
    <button class="btn-reset" onclick="limparTudo()">REINICIAR TUDO</button>
</div>

<div class="zoom-controls">
    <button class="zoom-btn" onclick="ajustarZoom(0.1, this)">+</button>
    <button class="zoom-btn" onclick="ajustarZoom(-0.1, this)">-</button>
</div>

<div id="canvas-container">
    <canvas id="mainCanvas"></canvas>
</div>

<div id="inventory">
    <h4>📦 ESTOQUE</h4>
    <div id="lista-estoque"></div>
    <div class="info-uso">
        <b>R</b>: Girar | <b>DEL</b>: Apagar<br>
        <b>SETAS</b>: Alterar Tamanho<br>
        Clique e arraste para mover.
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
