
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoPlanta 2D - ABNT</title>
    <style>
        :root { --blue: #00d2ff; --dark: #1a1a1a; --gray: #333; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; background: var(--dark); color: white; height: 100vh; }
        
        /* Painel Lateral */
        #sidebar { width: 350px; background: #222; padding: 20px; overflow-y: auto; border-right: 2px solid var(--gray); }
        h2 { color: var(--blue); border-bottom: 1px solid var(--gray); padding-bottom: 10px; }
        
        .section { background: #2b2b2b; padding: 15px; border-radius: 8px; margin-bottom: 15px; border-left: 4px solid var(--blue); }
        label { display: block; font-size: 14px; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; margin-bottom: 10px; border-radius: 4px; border: none; background: #444; color: white; }
        
        .btn-add { background: #28a745; color: white; border: none; padding: 10px; cursor: pointer; width: 100%; font-weight: bold; margin-bottom: 5px; }
        .btn-generate { background: var(--blue); color: #000; border: none; padding: 15px; cursor: pointer; width: 100%; font-weight: bold; font-size: 16px; margin-top: 10px; }
        
        /* Área do Desenho */
        #canvas-container { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #444; position: relative; }
        canvas { background: white; box-shadow: 0 0 30px rgba(0,0,0,0.5); cursor: crosshair; }
        .tabs { position: absolute; top: 20px; left: 20px; display: flex; gap: 10px; }
        .tab-btn { padding: 10px 20px; background: var(--gray); border: none; color: white; cursor: pointer; }
        .tab-btn.active { background: var(--blue); color: black; }
    </style>
</head>
<body>

<div id="sidebar">
    <h2>Configurações</h2>
    
    <div class="tabs-ui">
        <button class="tab-btn active" onclick="setAndar('terreo')">Térreo</button>
        <button class="tab-btn" onclick="setAndar('superior')">2º Andar</button>
    </div>

    <div class="section">
        <label>Medidas do Terreno (m)</label>
        <input type="number" id="terr_l" placeholder="Largura" value="10">
        <input type="number" id="terr_c" placeholder="Comprimento" value="20">
    </div>

    <div id="comodos-area">
        </div>

    <button class="btn-add" onclick="novoComodo()">+ Adicionar Cômodo</button>
    <button class="btn-generate" onclick="renderizar()">GERAR PLANTA TÉCNICA</button>
</div>

<div id="canvas-container">
    <div class="tabs">
        <span id="label-andar">Mostrando: Térreo</span>
    </div>
    <canvas id="mainCanvas" width="700" height="900"></canvas>
</div>

<script>
    // LÓGICA JAVASCRIPT
    let andarAtual = 'terreo';
    let projeto = {
        terreo: [],
        superior: []
    };

    function setAndar(a) {
        andarAtual = a;
        document.getElementById('label-andar').innerText = "Mostrando: " + (a === 'terreo' ? 'Térreo' : '2º Andar');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.innerText.toLowerCase().includes(a === 'terreo' ? 'térreo' : '2º')));
        renderizar();
    }

    function novoComodo() {
        const id = Date.now();
        const div = document.createElement('div');
        div.className = 'section';
        div.id = `comodo-${id}`;
        div.innerHTML = `
            <select onchange="updateComodo(${id}, 'tipo', this.value)">
                <option value="quarto">Quarto</option>
                <option value="sala">Sala</option>
                <option value="cozinha">Cozinha</option>
                <option value="banheiro">Banheiro</option>
                <option value="escada">Escada</option>
            </select>
            <div style="display:flex; gap:5px">
                <input type="number" placeholder="L" onchange="updateComodo(${id}, 'w', this.value)">
                <input type="number" placeholder="C" onchange="updateComodo(${id}, 'h', this.value)">
            </div>
            <label><input type="checkbox" onchange="updateComodo(${id}, 'suite', this.checked)"> Suíte/Closet</label>
            <button onclick="removerComodo(${id})" style="background:red; color:white; border:none; width:100%">Remover</button>
        `;
        document.getElementById('comodos-area').appendChild(div);
        projeto[andarAtual].push({ id, tipo: 'quarto', w: 3, h: 3, suite: false });
    }

    function updateComodo(id, campo, valor) {
        let c = projeto[andarAtual].find(i => i.id === id);
        if(c) c[campo] = valor;
    }

    function renderizar() {
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        const escala = 30; // 1 metro = 30 pixels
        
        // Desenha Terreno
        const tl = document.getElementById('terr_l').value * escala;
        const tc = document.getElementById('terr_c').value * escala;
        ctx.strokeStyle = "#000";
        ctx.lineWidth = 2;
        ctx.strokeRect(50, 50, tl, tc);

        // Desenha Cômodos do Andar Atual
        let xOff = 55;
        let yOff = 55;

        projeto[andarAtual].forEach(c => {
            const w = c.w * escala;
            const h = c.h * escala;
            
            ctx.fillStyle = "#fff";
            ctx.strokeStyle = "#000";
            ctx.lineWidth = 4; // Paredes conforme ABNT (linha grossa)
            ctx.strokeRect(xOff, yOff, w, h);
            
            ctx.fillStyle = "#000";
            ctx.font = "bold 12px Arial";
            ctx.fillText(c.tipo.toUpperCase(), xOff + 5, yOff + 20);
            ctx.font = "10px Arial";
            ctx.fillText(`${c.w}x${c.h}m`, xOff + 5, yOff + 35);
            
            // Lógica simples de empilhamento lateral
            xOff += w;
            if(xOff > tl) { xOff = 55; yOff += h; }
        });
    }
</script>

</body>
</html>
