
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Projeto de Edificação - Prancha Técnica</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="sidebar">
    <h3 class="titulo-topo">Projeto de <span class="azul">Edificação</span></h3>
    
    <div id="controles-quadrantes" class="section" style="display: none; background: #222; padding: 15px; border-radius: 8px; border: 1px solid #ff9800; margin-bottom: 15px;">
        <label style="color: #ff9800; font-weight: bold; display: block; margin-bottom: 10px; text-align: center;">✂️ FILTRAR RECORTE</label>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
            <button onclick="mudarQuadrante('esq')" style="background: #444; color: white; border: 1px solid #666; padding: 5px; cursor: pointer; border-radius: 4px;">ESQUERDO</button>
            <button onclick="mudarQuadrante('dir')" style="background: #444; color: white; border: 1px solid #666; padding: 5px; cursor: pointer; border-radius: 4px;">DIREITO</button>
            <button onclick="mudarQuadrante('cima')" style="background: #444; color: white; border: 1px solid #666; padding: 5px; cursor: pointer; border-radius: 4px;">EM CIMA</button>
            <button onclick="mudarQuadrante('baixo')" style="background: #444; color: white; border: 1px solid #666; padding: 5px; cursor: pointer; border-radius: 4px;">EM BAIXO</button>
            <button onclick="mudarQuadrante('todos')" style="grid-column: span 2; background: #ff9800; color: black; font-weight: bold; border: none; padding: 8px; border-radius: 4px; cursor: pointer;">VER TUDO (LIMPAR)</button>
        </div>
        <small style="color: #aaa; display: block; margin-top: 10px; text-align: center; font-size: 10px;">Esconde o que está fora do lado escolhido.</small>
    </div>

    <div class="bloco-config">
        <label>🎨 COR DO CÔMODO</label>
        <div style="display: flex; align-items: center; gap: 10px;">
            <input type="color" id="cor_escolhida" value="#00d2ff" oninput="document.getElementById('cor_preview').style.backgroundColor = this.value">
            <div id="cor_preview" style="width: 30px; height: 30px; border-radius: 50%; background: #00d2ff; border: 2px solid #555;"></div>
        </div>
    </div>

    <div class="bloco-config">
        <label>📋 DADOS TÉCNICOS</label>
        <input type="text" id="cli_nome" placeholder="Nome do Cliente">
        <input type="text" id="resp_tec" placeholder="Responsável Técnico">
        <div style="display: flex; gap: 5px; margin-top: 5px;">
            <input type="number" id="terr_larg" placeholder="Larg. (m)">
            <span style="color: #eee; align-self: center;">x</span>
            <input type="number" id="terr_comp" placeholder="Comp. (m)">
        </div>
    </div>

    <div class="section">
        <label>🏢 PAVIMENTO (CRIAR)</label>
        <select id="sel_andar">
            <option value="1">1º Andar (Térreo)</option>
            <option value="2">2º Andar (Superior)</option>
        </select>
    </div>

    <div class="section">
        <label>👁️ EXIBIR NO PAPEL</label>
        <select id="sel_andar_view" onchange="desenhar()">
            <option value="1">Ver 1º Andar</option>
            <option value="2">Ver 2º Andar</option>
        </select>
    </div>

    <div class="section">
        <button onclick="desenharVistaLateral()" style="background-color: #ff9800; color: white; border: none; padding: 10px; width: 100%; border-radius: 5px; cursor: pointer; font-weight: bold;">
            📐 VER VISTA LATERAL (CORTES)
        </button>
        <button onclick="voltarParaPlanta()" style="margin-top: 5px; width: 100%; padding: 5px; cursor: pointer; background: #555; color: white; border: none; border-radius: 5px;">
            ⬅️ VOLTAR PARA PLANTA
        </button>
    </div>

    <div class="section">
        <label>📐 COMPONENTE</label>
        <select id="sel_tipo">
            <optgroup label="Assets da Imagem">
                <option value="carro01">carro01</option>
                <option value="moto01">moto01</option>
                <option value="escada01">escada01</option>
                <option value="escada02">escada02</option>
                <option value="escada03">escada03</option>
                <option value="mesa-de-sinuca">mesa-de-sinuca</option>
                <option value="piscina01">piscina01</option>
                <option value="piscina02">piscina02</option>
                <option value="piscina03">piscina03</option>
                <option value="piscina04">piscina04</option>
                <option value="piscina05">piscina05</option>
                <option value="piscina06">piscina06</option>
                <option value="porta01">porta01</option>
                <option value="Porta02">Porta02</option>
                <option value="Porta03">Porta03</option>
                <option value="sala01">sala01</option>
                <option value="sala02">sala02</option>
                <option value="sala03">sala03</option>
                <option value="sala04">sala04</option>
                <option value="sofa03">sofa03</option>
                <option value="sofa04">sofa04</option>
            </optgroup>

            <optgroup label="Cômodos">
                <option value="kitnet">Kitnet</option>
                <option value="suite_master">Suíte Master</option>
                <option value="suite_normal">Suíte Normal</option>
                <option value="quarto">Quarto</option>
                <option value="corredor">Corredor</option>
                <option value="banheiro">Banheiro Social</option>
                <option value="banheiro_duplo">Banheiro Duplo</option>
                <option value="area_servico">Área de Serviço</option>
                <option value="lavanderia">Lavanderia</option>
                <option value="sala">Sala de Estar</option>
                <option value="cozinha">Cozinha</option>
                <option value="garagem">Garagem</option>
            </optgroup>
        </select>
        <div style="display: flex; gap: 5px; margin-top: 5px;">
            <input type="number" id="qtd_componente" value="1" min="1" style="width: 60px; padding: 5px;">
            <button class="btn-add" onclick="adicionarAoEstoque()" style="flex: 1; background: #4CAF50; color: white; border: none; padding: 8px; cursor: pointer; border-radius: 4px; font-weight: bold;">MANDAR PARA ESTOQUE</button>
        </div>
    </div>

    <div class="section" style="margin-top: 20px;">
        <button class="btn-print" onclick="window.print()" style="width: 100%; padding: 10px; background: #2196F3; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">🖨️ GERAR PDF / IMPRIMIR</button>
        <button class="btn-reset" onclick="limparTudo()" style="width: 100%; margin-top: 5px; padding: 10px; background: #f44336; color: white; border: none; border-radius: 5px; cursor: pointer;">REINICIAR TUDO</button>
    </div>
</div>

<div class="zoom-controls">
    <button class="zoom-btn" onclick="ajustarZoom(0.1)">+</button>
    <button class="zoom-btn" onclick="ajustarZoom(-0.1)">-</button>
</div>

<div id="canvas-container">
    <div id="canvas-wrapper" style="padding: 60px; display: inline-block; min-width: 100%;">
        <canvas id="mainCanvas" width="1200" height="800"></canvas>
    </div>
</div>

<div id="inventory">
    <h4>📦 ESTOQUE</h4>
    <div id="lista-estoque"></div>
</div>

<script src="script.js"></script>
</body>
</html>
