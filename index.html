<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Projeto de Edificação</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="sidebar">
    <h3 class="logo">Projeto de Edificação</h3>
    
    <div class="section">
        <label>🎨 COR DO CÔMODO</label>
        <div class="color-picker-container">
            <input type="color" id="cor_escolhida" value="#e0f7fa" onchange="atualizaPreviewCor()">
            <div id="preview-cor"></div>
        </div>
    </div>

    <div class="section">
        <label>🏢 PAVIMENTO</label>
        <select id="sel_andar">
            <option value="1">1º Andar (Térreo)</option>
            <option value="2">2º Andar (Superior)</option>
        </select>
    </div>

    <div class="section">
        <label>📐 COMPONENTE</label>
        <select id="sel_tipo">
            <optgroup label="Cômodos e Áreas">
                <option value="quarto">Quarto</option>
                <option value="sala">Sala de Estar</option>
                <option value="cozinha">Cozinha</option>
                <option value="banheiro">Banheiro</option>
                <option value="suite_master">Suíte Master</option>
                <option value="kitnet">Kitnet</option>
                <option value="lavanderia">Lavanderia</option>
                <option value="corredor">Corredor</option>
                <option value="garagem">Garagem</option>
                <option value="piscina">Piscina</option>
            </optgroup>
            <optgroup label="Escadas">
                <option value="escada_reta">Escada Reta</option>
                <option value="escada_l">Escada em L</option>
            </optgroup>
            <optgroup label="Mobiliário">
                <option value="cama_casal">Cama Casal</option>
                <option value="cama_solteiro">Cama Solteiro</option>
                <option value="mesa_4">Mesa (4 Lugares)</option>
                <option value="mesa_6">Mesa (6 Lugares)</option>
                <option value="mesa_8">Mesa (8 Lugares)</option>
                <option value="sofa_2">Sofá (2 Lugares)</option>
                <option value="sofa_3">Sofá (3 Lugares)</option>
            </optgroup>
            <optgroup label="Acessos (Portas/Janelas)">
                <option value="porta">Porta Simples (0.80m)</option>
                <option value="porta_dupla">Porta Dupla (1.60m)</option>
                <option value="janela">Janela Simples (1.50m)</option>
                <option value="janela_dupla">Janela Dupla (2.00m)</option>
                <option value="janela_basculante">Janela Basculante (0.60m)</option>
            </optgroup>
        </select>
        <button class="btn-add" onclick="adicionarAoEstoque()">MANDAR PARA ESTOQUE</button>
    </div>

    <div class="section">
        <label>📄 DADOS DO PROJETO</label>
        <input type="text" id="cli_nome" placeholder="Nome do Cliente" oninput="desenhar()">
        <input type="text" id="resp_tec" placeholder="Responsável Técnico" oninput="desenhar()">
    </div>

    <button class="btn-print" onclick="window.print()">🖨️ GERAR PDF / IMPRIMIR</button>
    <button class="btn-reset" onclick="limparTudo()">REINICIAR TUDO</button>
</div>

<div class="zoom-controls">
    <button class="zoom-btn" onclick="ajustarZoom(0.1)">+</button>
    <button class="zoom-btn" onclick="ajustarZoom(-0.1)">-</button>
</div>

<div id="canvas-container">
    <canvas id="mainCanvas"></canvas>
</div>

<div id="inventory">
    <h4>📦 ESTOQUE</h4>
    <div id="lista-estoque"></div>
    <div class="instrucoes">
        <b>R</b>: Girar | <b>DEL</b>: Apagar<br>
        Clique e arraste para mover.
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
