<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Projeto de Edificação</title>
    <style>
        :root { --blue: #00d2ff; --dark: #121212; --panel: #1e1e1e; --green: #28a745; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; background: var(--dark); color: white; height: 100vh; overflow: hidden; }
        #sidebar { width: 340px; background: var(--panel); padding: 15px; border-right: 1px solid #333; overflow-y: auto; flex-shrink: 0; }
        #canvas-container { flex: 1; background: #2a2a2a; display: flex; align-items: flex-start; justify-content: center; overflow: auto; padding: 30px; }
        #inventory { width: 250px; background: #181818; padding: 15px; border-left: 1px solid #333; flex-shrink: 0; }
        .section { background: #252525; padding: 12px; border-radius: 5px; margin-bottom: 10px; border-left: 3px solid var(--blue); }
        input, select, button { width: 100%; padding: 8px; margin: 4px 0; border-radius: 4px; border: none; background: #333; color: white; box-sizing: border-box; }
        .btn-add { background: var(--green); color: white; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-export { background: var(--blue); color: #000; cursor: pointer; font-weight: bold; margin-top: 15px; }
        canvas { background: white; box-shadow: 0 10px 40px rgba(0,0,0,0.5); outline: none; }
    </style>
</head>
<body>

<div id="sidebar">
    <h2>Projeto de <span style="color:var(--blue)">Edificação</span></h2>
    
    <div class="section">
        <label><b>TERRENO (m)</b></label>
        <div style="display:flex; gap:5px;">
            <input type="number" id="terr_w" value="20" oninput="desenhar()">
            <input type="number" id="terr_h" value="30" oninput="desenhar()">
        </div>
    </div>

    <div class="section">
        <label><b>DADOS</b></label>
        <input type="text" id="cli_nome" placeholder="Cliente" oninput="desenhar()">
        <input type="text" id="resp_edit" placeholder="Responsável pela Edição" oninput="desenhar()">
        <input type="number" id="proj_ano" value="2026" oninput="desenhar()">
    </div>

    <div class="section">
        <label><b>ADICIONAR</b></label>
        <select id="sel_tipo">
            <optgroup label="Portas">
                <option value="p_dupla">Porta Dupla (1.60m)</option>
                <option value="p_social">Porta Social (1.20m)</option>
                <option value="p_comum">Porta Comum (0.80m)</option>
                <option value="p_garagem">Portão Garagem (3.50m)</option>
            </optgroup>
            <optgroup label="Janelas">
                <option value="j_tripla">Janela Tripla (2.00m)</option>
                <option value="j_dupla">Janela Dupla (1.50m)</option>
                <option value="j_banheiro">Basculante (0.60m)</option>
            </optgroup>
            <optgroup label="Cômodos">
                <option value="sala">Sala</option>
                <option value="quarto">Quarto</option>
                <option value="cozinha">Cozinha</option>
                <option value="banheiro">Banheiro</option>
                <option value="garagem">Garagem</option>
                <option value="lavanderia">Lavanderia</option>
                <option value="piscina">Piscina</option>
                
            </optgroup>
        </select>
        <button class="btn-add" onclick="adicionarAoEstoque()">ADICIONAR AO ESTOQUE</button>
    </div>

    <button class="btn-export" onclick="exportarProjeto()">💾 GERAR DOCUMENTO FINAL</button>
</div>

<div id="canvas-container">
    <canvas id="mainCanvas" tabindex="1"></canvas>
</div>

<div id="inventory">
    <h3>📦 Itens Criados</h3>
    <div id="lista-estoque"></div>
</div>

<script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const escala = 18; 
    const folhaW = 1123; const folhaH = 794; 
    let estoque = [], noTerreno = [], selecionado = null, arrastando = false, offset = { x: 0, y: 0 };

    function adicionarAoEstoque() {
        const t = document.getElementById('sel_tipo').value;
        let w = 3.0, h = 4.0;
        
        if(t === 'p_dupla') { w = 1.6; h = 0.15; }
        else if(t === 'p_social') { w = 1.2; h = 0.15; }
        else if(t === 'p_comum') { w = 0.8; h = 0.15; }
        else if(t === 'p_garagem') { w = 3.5; h = 0.15; }
        else if(t === 'j_tripla') { w = 2.0; h = 0.15; }
        else if(t === 'j_dupla') { w = 1.5; h = 0.15; }
        else if(t === 'j_banheiro') { w = 0.6; h = 0.15; }
        else if(t === 'garagem') { w = 3.5; h = 5.5; }
        else if(t === 'lavanderia') { w = 2.0; h = 3.0; }
        else if(t === 'banheiro') { w = 1.5; h = 2.5; }
        else if(t === 'piscina') { w = 3,0; h = 6,0 }

        estoque.push({ id: Date.now(), tipo: t, w, h });
        atualizarEstoqueUI();
    }

    function atualizarEstoqueUI() {
        const container = document.getElementById('lista-estoque');
        container.innerHTML = '';
        estoque.forEach(item => {
            const div = document.createElement('div');
            div.style.cssText = "background:#333; padding:8px; margin-bottom:5px; border-radius:4px; cursor:pointer; font-size:11px;";
            div.innerHTML = `<b>${item.tipo.toUpperCase()}</b><br>${item.w}m x ${item.h}m`;
            div.onclick = () => { noTerreno.push({...item, x:100, y:100, rot:0, id: Date.now()}); desenhar(); };
            container.appendChild(div);
        });
    }

    function desenharTabelas() {
        const xQ = folhaW - 320; ctx.strokeStyle = "#000"; ctx.lineWidth = 1;
        
        // QUADRO DE ÁREAS
        ctx.strokeRect(xQ, 40, 280, 110);
        ctx.fillStyle = "#f0f0f0"; ctx.fillRect(xQ, 40, 280, 25);
        ctx.fillStyle = "#000"; ctx.font = "bold 11px Arial"; ctx.fillText("QUADRO DE ÁREAS", xQ + 85, 57);
        
        let areaC = 0;
        noTerreno.forEach(o => { if(!['p','j'].includes(o.tipo[0])) areaC += (o.w * o.h); });
        const areaT = Number(document.getElementById('terr_w').value) * Number(document.getElementById('terr_h').value);

        ctx.font = "10px Arial";
        ctx.fillText(`ÁREA DO TERRENO: ${areaT.toFixed(2)} m²`, xQ + 10, 85);
        ctx.fillText(`ÁREA CONSTRUÍDA: ${areaC.toFixed(2)} m²`, xQ + 10, 105);
        ctx.fillText(`ÁREA LIVRE: ${(areaT - areaC).toFixed(2)} m²`, xQ + 10, 125);

        // SELO ABNT
        const sY = folhaH - 140; ctx.strokeRect(xQ, sY, 280, 100);
        ctx.beginPath(); ctx.moveTo(xQ, sY + 33); ctx.lineTo(xQ+280, sY + 33); 
        ctx.moveTo(xQ, sY + 66); ctx.lineTo(xQ+280, sY + 66); ctx.stroke();
        ctx.font = "bold 10px Arial";
        ctx.fillText("CLIENTE: " + (document.getElementById('cli_nome').value || "NOME DO CLIENTE").toUpperCase(), xQ+10, sY+22);
        ctx.fillText("RESP. EDIÇÃO: " + (document.getElementById('resp_edit').value || "MÁRCIO").toUpperCase(), xQ+10, sY+55);
        ctx.fillText("ANO: " + document.getElementById('proj_ano').value + "  |  ESCALA 1:50", xQ+10, sY+88);
    }

    function desenhar() {
        canvas.width = folhaW; canvas.height = folhaH;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        const tw = document.getElementById('terr_w').value * escala;
        const th = document.getElementById('terr_h').value * escala;
        ctx.setLineDash([8, 4]); ctx.strokeStyle = "#bbb"; ctx.strokeRect(40, 40, tw, th);
        ctx.setLineDash([]); 

        noTerreno.forEach(obj => {
            const w = obj.w * escala, h = obj.h * escala;
            ctx.save(); ctx.translate(obj.x + w/2, obj.y + h/2); ctx.rotate(obj.rot * Math.PI / 180);
            
            if(obj.tipo.startsWith('j') || obj.tipo.startsWith('p')) {
                ctx.fillStyle = "#fff"; ctx.fillRect(-w/2, -h/2, w, h);
                ctx.strokeStyle = obj.tipo.startsWith('j') ? "#00d2ff" : "#8b4513";
                ctx.lineWidth = 2; ctx.strokeRect(-w/2, -h/2, w, h);
                
                if(obj.tipo.startsWith('j')) { 
                    ctx.beginPath(); ctx.moveTo(-w/2, 0); ctx.lineTo(w/2, 0); ctx.stroke(); 
                } else if(obj.tipo === 'p_dupla' || obj.tipo === 'p_garagem') {
                    ctx.beginPath();
                    ctx.arc(-w/2, h/2, w/2, 0, -Math.PI/2, true);
                    ctx.arc(w/2, h/2, w/2, Math.PI, Math.PI*1.5);
                    ctx.stroke();
                } else {
                    ctx.beginPath(); ctx.arc(-w/2, h/2, w, 0, -Math.PI/2, true); ctx.stroke();
                }
            } else {
                ctx.strokeStyle = "#000"; ctx.lineWidth = 2; ctx.strokeRect(-w/2, -h/2, w, h);
            }
            ctx.fillStyle = "#000"; ctx.font = "bold 9px Arial";
            ctx.fillText(obj.tipo.toUpperCase(), -w/2, -h/2 - 5);
            ctx.restore();
        });
        desenharTabelas();
    }

    function exportarProjeto() {
        const link = document.createElement('a');
        link.download = `PROJETO_${document.getElementById('cli_nome').value || 'TECNICO'}.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();
    }

    canvas.onmousedown = (e) => {
        const r = canvas.getBoundingClientRect(); const sc = folhaW / r.width;
        const mx = (e.clientX - r.left) * sc; const my = (e.clientY - r.top) * sc;
        selecionado = null;
        for (let i = noTerreno.length - 1; i >= 0; i--) {
            let o = noTerreno[i]; if (mx >= o.x && mx <= o.x + (o.w*escala) && my >= o.y && my <= o.y + (o.h*escala)) {
                selecionado = o; arrastando = true; offset.x = mx - o.x; offset.y = my - o.y; break;
            }
        }
        desenhar();
    };
    window.onmousemove = (e) => { if (arrastando && selecionado) {
        const r = canvas.getBoundingClientRect(); const sc = folhaW / r.width;
        selecionado.x = (e.clientX - r.left) * sc - offset.x; selecionado.y = (e.clientY - r.top) * sc - offset.y;
        desenhar();
    }};
    window.onmouseup = () => arrastando = false;
    canvas.onkeydown = (e) => {
        if (!selecionado) return;
        if (e.key.toLowerCase() === "r") selecionado.rot = (selecionado.rot + 90) % 360;
        if (e.key === "Delete") { noTerreno = noTerreno.filter(o => o.id !== selecionado.id); selecionado = null; }
        desenhar();
    };
    canvas.onclick = () => canvas.focus();
    desenhar();
</script>
</body>
</html>
