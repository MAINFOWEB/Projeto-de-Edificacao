<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Projeto de Edificação</title>
    <style>
        :root { --blue: #00d2ff; --dark: #121212; --panel: #1e1e1e; --green: #28a745; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; background: var(--dark); color: white; height: 100vh; overflow: hidden; }
        #sidebar { width: 330px; background: var(--panel); padding: 15px; border-right: 1px solid #333; overflow-y: auto; z-index: 10; }
        #inventory { width: 260px; background: #181818; padding: 15px; border-left: 1px solid #333; }
        .section { background: #252525; padding: 12px; border-radius: 5px; margin-bottom: 10px; border-left: 3px solid var(--blue); }
        .item-pronto { background: #333; padding: 10px; margin-bottom: 8px; border-radius: 4px; cursor: pointer; border: 1px solid #444; font-size: 11px; }
        input, select, button { width: 100%; padding: 10px; margin: 5px 0; border-radius: 4px; border: none; background: #333; color: white; box-sizing: border-box; font-size: 14px; }
        .btn-add { background: var(--green); color: white; cursor: pointer; font-weight: bold; margin-top: 10px; }
        #canvas-container { flex: 1; background: #333; display: flex; align-items: center; justify-content: center; overflow: auto; position: relative; }
        canvas { background: white; box-shadow: 0 0 30px rgba(0,0,0,0.5); outline: none; }
        .instrucoes { font-size: 11px; color: #888; margin-top: 10px; line-height: 1.4; }
    </style>
</head>
<body>

<div id="sidebar">
    <h2>Projeto de  <span style="color:var(--blue)">Edificações</span></h2>
    <div class="section">
        <label><b>PROPRIETÁRIO:</b></label>
        <input type="text" id="prop_nome" placeholder="Digite o nome..." oninput="desenhar()">
        <label><b>DATA:</b></label>
        <input type="text" id="proj_data" placeholder="00/00/0000" oninput="desenhar()">
    </div>
    <div class="section">
        <label><b>SELECIONAR ESTRUTURA / ACESSO</b></label>
        <select id="sel_tipo">
            <optgroup label="Cômodos">
                <option value="quarto">Quarto</option>
                <option value="sala">Sala</option>
                <option value="cozinha">Cozinha</option>
                <option value="banheiro">Banheiro</option>
                <option value="lavanderia">Lavanderia</option>
                <option value="garagem_area">Área Garagem</option>
            </optgroup>
            <optgroup label="Portas e Acessos">
                <option value="p_comum">Porta Comum (Giro)</option>
                <option value="p_social">Porta Social (Dupla)</option>
                <option value="p_garagem">Portão de Garagem</option>
            </optgroup>
            <optgroup label="Janelas">
                <option value="j_dupla">Janela Dupla</option>
                <option value="j_tripla">Janela Tripla</option>
            </optgroup>
        </select>
        <button class="btn-add" onclick="adicionarAoEstoque()">+ CRIAR NO ESTOQUE</button>
    </div>
    <div class="instrucoes">
        <b>CONTROLES DE SELEÇÃO:</b><br>
        1. Clique no bloco para selecionar.<br>
        2. <b>SHIFT + Setas:</b> Aumenta/Diminui tamanho.<br>
        3. <b>Tecla R:</b> Gira o objeto selecionado.
    </div>
</div>

<div id="canvas-container">
    <canvas id="mainCanvas" tabindex="1"></canvas>
</div>

<div id="inventory">
    <h3>📦 Estoque</h3>
    <div id="lista-estoque"></div>
</div>

<script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const escala = 30;
    const folhaW = 794; const folhaH = 1123;
    let estoque = [], noTerreno = [], selecionado = null, offset = { x: 0, y: 0 };

    function adicionarAoEstoque() {
        const t = document.getElementById('sel_tipo').value;
        let w = 3.0, h = 4.0;
        
        // Tamanhos Padrão
        if(t === 'p_comum') { w = 0.8; h = 0.15; }
        else if(t === 'p_social') { w = 1.6; h = 0.15; }
        else if(t === 'p_garagem') { w = 3.5; h = 0.25; }
        else if(t === 'banheiro') { w = 1.5; h = 2.5; }
        else if(t === 'lavanderia') { w = 2.0; h = 2.0; }
        else if(t.includes('j_')) { w = 1.5; h = 0.15; }

        estoque.push({ id: Date.now(), tipo: t, w, h });
        atualizarEstoqueUI();
    }

    function atualizarEstoqueUI() {
        const container = document.getElementById('lista-estoque');
        container.innerHTML = '';
        estoque.forEach(item => {
            const div = document.createElement('div');
            div.className = 'item-pronto';
            div.innerHTML = `<strong>${item.tipo.toUpperCase()}</strong><br>${item.w.toFixed(2)}m x ${item.h.toFixed(2)}m`;
            div.onclick = () => { 
                noTerreno.push({...item, x:200, y:200, rot:0, id: Date.now()}); 
                desenhar(); 
            };
            container.appendChild(div);
        });
    }

    function desenharSelo() {
        const p = document.getElementById('prop_nome').value || "PROPRIETÁRIO";
        const d = document.getElementById('proj_data').value || "--/--/----";
        const pX = folhaW - 300, pY = folhaH - 160;

        ctx.strokeStyle = "#000"; ctx.lineWidth = 2;
        ctx.strokeRect(pX, pY, 260, 120);
        ctx.beginPath(); 
        ctx.moveTo(pX, pY+40); ctx.lineTo(pX+260, pY+40); 
        ctx.moveTo(pX, pY+80); ctx.lineTo(pX+260, pY+80); 
        ctx.stroke();

        ctx.fillStyle = "#000"; ctx.font = "bold 10px Arial";
        ctx.fillText("PROPRIETÁRIO: " + p.toUpperCase(), pX+10, pY+25);
        ctx.fillText("DATA: " + d, pX+10, pY+65);
        ctx.fillText("RESPONSÁVEL: MÁRCIO", pX+10, pY+105);
    }

    function desenhar() {
        canvas.width = folhaW; canvas.height = folhaH;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = "#eee"; ctx.strokeRect(20, 20, folhaW-40, folhaH-40);

        noTerreno.forEach(obj => {
            const w = obj.w * escala; const h = obj.h * escala;
            ctx.save();
            ctx.translate(obj.x + w/2, obj.y + h/2);
            ctx.rotate(obj.rot * Math.PI / 180);

            ctx.fillStyle = obj === selecionado ? "rgba(0, 210, 255, 0.1)" : "#fff";
            
            if(obj.tipo === 'p_comum') {
                ctx.strokeStyle = "#8b4513"; ctx.lineWidth = 2;
                ctx.strokeRect(-w/2, -h/2, w, h);
                ctx.beginPath(); ctx.arc(-w/2, h/2, w, 0, -Math.PI/2, true); ctx.stroke();
            } else if(obj.tipo.includes('j_')) {
                ctx.strokeStyle = "#00d2ff"; ctx.lineWidth = 2;
                ctx.strokeRect(-w/2, -h/2, w, h);
                let f = obj.tipo.includes('tripla') ? 3 : 2;
                for(let i=1; i<f; i++) {
                    ctx.beginPath(); ctx.moveTo(-w/2 + (w/f)*i, -h/2); ctx.lineTo(-w/2 + (w/f)*i, h/2); ctx.stroke();
                }
            } else {
                ctx.fillRect(-w/2, -h/2, w, h);
                ctx.strokeStyle = "#000"; ctx.lineWidth = obj === selecionado ? 4 : 2;
                ctx.strokeRect(-w/2, -h/2, w, h);
            }
            
            ctx.fillStyle = "#000"; ctx.font = "bold 8px Arial";
            ctx.fillText(`${obj.tipo.toUpperCase()} (${obj.w.toFixed(1)}m)`, -w/2, -h/2 - 5);
            ctx.restore();
        });
        desenharSelo();
    }

    // Teclado
    canvas.addEventListener('keydown', (e) => {
        if (!selecionado) return;
        const step = 0.1;
        if (e.shiftKey) {
            if (e.key === "ArrowRight") selecionado.w += step;
            if (e.key === "ArrowLeft") selecionado.w = Math.max(0.1, selecionado.w - step);
            if (e.key === "ArrowDown") selecionado.h += step;
            if (e.key === "ArrowUp") selecionado.h = Math.max(0.1, selecionado.h - step);
        } else {
            if (e.key === "ArrowRight") selecionado.x += 5;
            if (e.key === "ArrowLeft") selecionado.x -= 5;
            if (e.key === "ArrowDown") selecionado.y += 5;
            if (e.key === "ArrowUp") selecionado.y -= 5;
        }
        if (e.key.toLowerCase() === "r") selecionado.rot = (selecionado.rot + 90) % 360;
        desenhar();
        e.preventDefault();
    });

    canvas.onmousedown = (e) => {
        const r = canvas.getBoundingClientRect();
        const sc = folhaW / r.width;
        const mx = (e.clientX - r.left) * sc; const my = (e.clientY - r.top) * sc;
        
        let encontrou = false;
        for (let i = noTerreno.length - 1; i >= 0; i--) {
            let o = noTerreno[i]; const w = o.w * escala, h = o.h * escala;
            if (mx >= o.x && mx <= o.x + w && my >= o.y && my <= o.y + h) {
                selecionado = o; offset.x = mx - o.x; offset.y = my - o.y;
                encontrou = true; break;
            }
        }
        if(!encontrou) selecionado = null;
        desenhar();
    };

    window.onmousemove = (e) => {
        if (selecionado && !e.shiftKey) {
            const r = canvas.getBoundingClientRect();
            const sc = folhaW / r.width;
            selecionado.x = (e.clientX - r.left) * sc - offset.x;
            selecionado.y = (e.clientY - r.top) * sc - offset.y;
            desenhar();
        }
    };

    canvas.onclick = () => canvas.focus();

    desenhar();
</script>
</body>
</html>
