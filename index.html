<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAINFOWEB - Projeto de Edificações</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="sidebar">
    <h3 style="color: #00d2ff; text-align: center;">PROJETO DE EDIFICAÇÃO</h3>
    
    <div class="section">
        <label>🎨 COR DO CÔMODO</label>
        <input type="color" id="cor_escolhida" value="#e0f7fa">
    </div>

    <div class="section">
        <label>📐 COMPONENTE</label>
        <select id="sel_tipo">
            <optgroup label="Áreas Externas">
                <option value="piscina">Piscina (6x3m)</option>
                <option value="garagem">Garagem</option>
            </optgroup>
            <optgroup label="Cômodos">
                <option value="quarto">Quarto</option>
                <option value="sala">Sala de Estar</option>
                <option value="cozinha">Cozinha</option>
                <option value="banheiro">Banheiro</option>
                <option value="suite_master">Suíte Master</option>
            </optgroup>
            <optgroup label="Mobiliário">
                <option value="cama_casal">Cama Casal</option>
                <option value="cama_solteiro">Cama Solteiro</option>
                <option value="mesa_6">Mesa (6 Lugares)</option>
                <option value="sofa_3">Sofá 3 Lugares</option>
            </optgroup>
            <optgroup label="Acessos">
                <option value="porta">Porta (0.80m)</option>
                <option value="janela">Janela (1.50m)</option>
            </optgroup>
        </select>
        <button class="btn-add" onclick="adicionarAoEstoque()">MANDAR PARA ESTOQUE</button>
    </div>

    <div class="section">
        <label>📄 DADOS DO PROJETO</label>
        <input type="text" id="cli_nome" placeholder="Cliente" oninput="desenhar()">
        <input type="text" id="resp_tec" placeholder="Técnico" oninput="desenhar()">
    </div>

    <button class="btn-print" onclick="window.print()">🖨️ IMPRIMIR / PDF</button>
    <button class="btn-reset" onclick="limparTudo()">LIMPAR PLANTA</button>
</div>

<div class="zoom-controls">
    <button class="zoom-btn" onclick="ajustarZoom(0.1)">+</button>
    <button class="zoom-btn" onclick="ajustarZoom(-0.1)">-</button>
</div>

<div id="canvas-container">
    <canvas id="mainCanvas"></canvas>
</div>

<div id="inventory">
    <h4 style="margin: 0 0 10px 0; color: #00d2ff; border-bottom: 1px solid #333; padding-bottom: 5px;">📦 ESTOQUE</h4>
    <div id="lista-estoque"></div>
</div>

<script src="script.js"></script>
</body>
</html>
